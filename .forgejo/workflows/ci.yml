on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Just
        uses: extractions/setup-just@v3
      - name: Install prek
        run: uv tool install prek
      - name: Run CI
        run: just ci
